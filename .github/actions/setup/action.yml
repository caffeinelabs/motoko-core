name: Setup Environment
description: Common dependencies setup for all workflows

inputs:
  setup-mops:
    description: Whether to setup mops
    required: false
    default: "true"
  moc:
    description: moc version to use instead of the one pinned in mops.toml
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - name: Cache mops packages before installing dependencies
      if: ${{ inputs.setup-mops == 'true' }}
      id: mops-cache
      uses: actions/cache@v5
      with:
        key: mops-packages-${{ hashFiles('mops.toml') }}
        restore-keys: |
          mops-packages-${{ hashFiles('mops.toml') }}
          mops-packages-
        path: |
          ~/.cache/mops

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Override the pinned moc
      if: ${{ inputs.moc != '' }}
      shell: bash
      env:
        MOC: ${{ inputs.moc }}
      run: npx ic-mops toolchain use moc "$MOC"
