name: Tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-changelog:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          setup-mops: false
      - run: npm run validate:changelog

  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          setup-mops: false
      - run: npm run validate:version

  check-orphans:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: npm run check:orphans

  validate-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: npm run validate:api
      - name: Check for API changes
        run: |
          DIFF=$(git diff -- validation/api)
          if [ -n "$DIFF" ]; then
            echo "API changes:"
            echo "$DIFF"
            echo
            echo '>>> If this looks correct, please run the command `npm run validate` and commit the output.'
            echo
            exit 1
          fi

  validate-docs:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Validate doc examples (shard ${{ matrix.shard }}/5)
        run: npm run validate:docs -- --shard=${{ matrix.shard }}/5
        env:
          FORCE_COLOR: 2 # https://github.com/chalk/supports-color/issues/106

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: npm run format:check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: npm test

      - name: Tests under legacy persistence
        run: npx ic-mops test List.allocation -- --legacy-persistence

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run benchmarks (same replica path as mops publish)
        run: npm run bench

  # Single required check. Every job runs unconditionally, so a green gate means
  # the full suite ran. validate-changelog is advisory and deliberately absent.
  ci:
    name: "ci:required"
    if: always()
    needs: [validate-version, check-orphans, validate-api, validate-docs, format, test, bench]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
