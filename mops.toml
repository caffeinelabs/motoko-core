[package]
name = "core"
version = "2.6.2"
description = "The Motoko standard library"
repository = "https://github.com/caffeinelabs/motoko-core"
keywords = [ "core", "base", "data-structure", "stable-memory", "persistent" ]
license = "Apache-2.0"

[dev-dependencies]
test = "2.1.2"
bench = "2.0.1"
matchers = "2.1.0"
bench-helper = "0.0.3"

[requirements]
moc = "1.6.0"

[toolchain]
moc = "1.16.0"
wasmtime = "44.0.0"
pocket-ic = "12.0.0"

[moc]
args = [ "-E=M0154,M0223" ]
